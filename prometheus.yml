global:
  scrape_interval: 15s  # How often to scrape targets by default.

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape FastAPI (Replace the port if your FastAPI runs on a different port)
  - job_name: 'fastapi'
    static_configs:
      - targets: ['host.docker.internal:8000']  # Assumes FastAPI is running on port 8000
