services:
  fastapi-app:
    build:
      context: ./app  # Path to your FastAPI app folder
      dockerfile: Dockerfile
    container_name: fastapi-app
    ports:
      - "8000:8000"  # Expose port 8000 for FastAPI
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    depends_on:
      - mlflow
  mlflow:
    image: burakince/mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./volumes/mlflow_data:/data
    command: [
      "mlflow", "server",
      "--backend-store-uri", "sqlite:////data/mlflow.db",
      "--default-artifact-root", "file:///data/mlruns",
      "--host=0.0.0.0",
      "--port=5000"
    ]
  prometheus:
    image: bitnami/prometheus:latest
    container_name: prometheus-server
    ports:
      - "9090:9090"
    volumes:
      - ./volumes/prometheus_data:/opt/bitnami/prometheus/data
      - ./prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-server
    ports:
      - "3000:3000"
    volumes:
      - ./volumes/grafana_data:/var/lib/grafana

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack-pro  # required for Pro
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
      - "127.0.0.1:443:443"              # LocalStack HTTPS Gateway (Pro)
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}  # required for Pro
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - "./volumes/localstack_data:/var/lib/localstack"  # Persist data
      - "/var/run/docker.sock:/var/run/docker.sock"
 
networks:
  default:
    driver: bridge